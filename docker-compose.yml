services:
  db:
    image: postgres:16
    deploy:
      resources:
        limits:
          memory: 1024M
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-www}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-www}
      POSTGRES_DB: ${POSTGRES_DB:-www}
    ports:
      # Bound to localhost only — the app (on the host via pm2, or another
      # container using host.docker.internal) reaches this over loopback;
      # it's never meant to be reachable from outside the machine.
      - "127.0.0.1:5432:5432"
    volumes:
      - www_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - www_redis:/data

volumes:
  www_pg:
  www_redis:
